name: Release - Development

on:
  pull_request:
    branches:
      - development
    types:
      - closed

env:
  PROJECT_PATH: ./src/Utilities.Configuration/Utilities.Configuration.csproj
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  NUGET_URL: 'https://nuget.pkg.github.com/lee-lott-apps/index.json'
  NUGET_PACKAGE_NAME: 'Utilities.Configuration'
  PRERELEASE: true
  PRERELEASE_SUFFIX: 'Dev'
  BUILD_CONFIGURATION: 'Release'
  DEPLOYMENT_ENVIRONMENT: 'Development'

permissions:
  packages: write
  contents: write
  actions: write
  pull-requests: write
  deployments: write

jobs:
  create-github-release:
    if: github.event.pull_request.merged == true && github.event.pull_request.user.login != vars.DEVOPS_BOT_NAME
    name: Create GitHub Release
    runs-on: ubuntu-latest
    outputs:
      version-number: ${{ steps.build-project.outputs.version-number }}
      version-tag: ${{ steps.build-project.outputs.version-tag }}
      nuget-file-name: ${{ steps.build-project.outputs.nuget-file-name }}
      build-status: ${{ steps.build-project.outputs.build-status }}

    steps:
      - name: Setup
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Get GitHub App Token
        id: token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.DEVOPSBOT_APP_ID }}
          private-key: ${{ secrets.DEVOPSBOT_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}      
          permission-contents: write
          permission-pull-requests: write          
          
      - name: Build NuGet Package
        id: build-project
        uses: lee-lott-actions/build-vsproject-dotnet-nuget-release@v1
        with:
          project-file-path: ${{ env.PROJECT_PATH }}
          prerelease: ${{ env.PRERELEASE }}
          prerelease-suffix: ${{ env.PRERELEASE_SUFFIX }}
          package-name: ${{ env.NUGET_PACKAGE_NAME }}
          configuration: ${{ env.BUILD_CONFIGURATION }}
          token: ${{ steps.token.outputs.token }}

      - name: Upload Package
        if: ${{ steps.build-project.outputs.build-status == 'Release Created' }}
        uses: actions/upload-artifact@v6
        with:
          name: nuget-package
          path: ${{ steps.build-project.outputs.nuget-file-path }}

  deploy-nuget-package:
    name: Deploy NuGet Package
    runs-on: ubuntu-latest
    needs: [ create-github-release ]
    if: ${{ needs.create-github-release.outputs.build-status == 'Release Created' }}
    env:
      version-number: ${{ needs.create-github-release.outputs.version-number }}
      version-tag: ${{ needs.create-github-release.outputs.version-tag }}
      nuget-file-name: ${{ needs.create-github-release.outputs.nuget-file-name }}

    steps:
      - name: Setup
        uses: actions/checkout@v6
          
      - name: Download Package
        uses: actions/download-artifact@v7
        with:
          name: nuget-package
          github-token: ${{ env.GITHUB_TOKEN }}

      - name: Deploy NuGet Package
        uses: lee-lott-actions/deploy-nuget-package@v2
        with:
          nuget-file-path: ${{ env.nuget-file-name }}
          nuget-url: ${{ env.NUGET_URL }}
          nuget-package-name: ${{ env.NUGET_PACKAGE_NAME }}
          nuget-package-version: ${{ env.version-number }}
          version-tag: ${{ env.version-tag }}
          deployment-environment: ${{ env.DEPLOYMENT_ENVIRONMENT }}
          org-name: ${{ github.repository_owner }}     
          repo-name: ${{ github.event.repository.name }}
          token: ${{ env.GITHUB_TOKEN }}
      
  pull-request-not-merged:
    if: github.event.pull_request.merged == false
    name: Cancel Release
    runs-on: ubuntu-latest
    steps:
    - run: |
        Write-Output "Pull Request was not merged with branch. Release was canceled."
      shell: pwsh
